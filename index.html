<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çocuklar İçin Robot Tasarım Stüdyosu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            touch-action: manipulation;
        }
        .canvas-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 0);
            background-size: 24px 24px;
        }
        .robot-part {
            cursor: grab;
            user-select: none;
            transition: transform 0.15s ease;
        }
        .robot-part:active {
            cursor: grabbing;
        }
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(-5deg); }
            75% { transform: translateY(-15px) rotate(5deg); }
        }
        .dancing {
            animation: dance 0.4s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center p-4">

    <!-- Üst Header -->
    <header class="text-center my-4">
        <h1 class="text-3xl md:text-5xl font-bold text-yellow-300 drop-shadow-md flex items-center justify-center gap-3">
            <span>🤖</span> Robot Tasarım Stüdyosu <span>✨</span>
        </h1>
        <p class="text-purple-200 text-sm md:text-base mt-1">Parçaları sürükle veya tıkla, kendi robotunu oluştur!</p>
    </header>

    <!-- Ana Konfigüratör Alanı -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Sol Panel: Parça Seçimi -->
        <section class="lg:col-span-4 bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/20 shadow-xl flex flex-col gap-4">
            
            <!-- Kategori Sekmeleri -->
            <div class="flex justify-around bg-black/20 p-1.5 rounded-2xl">
                <button onclick="setCategory('heads')" id="btn-heads" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold bg-yellow-400 text-gray-900 shadow">Baş</button>
                <button onclick="setCategory('bodies')" id="btn-bodies" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold hover:bg-white/10">Gövde</button>
                <button onclick="setCategory('accessories')" id="btn-accessories" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold hover:bg-white/10">Aksesuar</button>
            </div>

            <!-- Parça İkonları Izgarası -->
            <div id="parts-grid" class="grid grid-cols-3 gap-3 max-h-64 overflow-y-auto p-1">
                <!-- JavaScript tarafından dinamik doldurulur -->
            </div>

            <!-- Renk Değiştirme Paleti -->
            <div class="border-t border-white/10 pt-3">
                <p class="text-xs font-semibold text-purple-200 mb-2 text-center">Seçili Parça Rengi:</p>
                <div class="flex justify-center gap-2 flex-wrap" id="color-picker">
                    <!-- Renk butonları JS ile eklenir -->
                </div>
            </div>
        </section>

        <!-- Sağ Panel: Tuval (Canvas) ve Robot Alanı -->
        <section class="lg:col-span-8 flex flex-col items-center gap-4">
            
            <!-- İsimlendirme & Üst Kontroller -->
            <div class="w-full flex flex-wrap gap-3 items-center justify-between bg-white/10 p-3 rounded-2xl border border-white/10">
                <input type="text" id="robot-name" value="Süper Robot 3000" class="bg-black/30 text-yellow-300 font-bold text-lg px-4 py-2 rounded-xl outline-none border border-yellow-400/30 w-full sm:w-auto text-center sm:text-left">
                
                <div class="flex gap-2 w-full sm:w-auto justify-center">
                    <button onclick="clearCanvas()" class="bg-red-500/80 hover:bg-red-600 text-white px-3 py-2 rounded-xl text-xs font-bold transition">Temizle 🗑️</button>
                    <button onclick="activateRobot()" class="bg-emerald-400 hover:bg-emerald-300 text-gray-900 px-4 py-2 rounded-xl text-xs font-bold shadow-lg transition flex items-center gap-1">Çalıştır! ⚡</button>
                </div>
            </div>

            <!-- Sürükle Bırak Tuvali -->
            <div id="canvas" class="relative w-full h-[420px] bg-black/30 rounded-3xl border-2 border-dashed border-white/30 canvas-grid overflow-hidden flex items-center justify-center">
                <p id="placeholder-text" class="text-white/40 text-center pointer-events-none text-sm md:text-base">
                    👈 Sol taraftan parça seçerek robotunu oluşturmaya başla!
                </p>
            </div>
        </section>
    </main>

    <!-- JavaScript Kodları -->
    <script>
        // Parça Kütüphanesi (SVG Görseller)
        const partsData = {
            heads: [
                { id: 'h1', svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><rect x="20" y="25" width="60" height="50" rx="12" fill="currentColor"/><circle cx="38" cy="45" r="8" fill="#fff"/><circle cx="62" cy="45" r="8" fill="#fff"/><circle cx="38" cy="45" r="4" fill="#000"/><circle cx="62" cy="45" r="4" fill="#000"/><rect x="35" y="62" width="30" height="6" rx="3" fill="#fff"/><line x1="50" y1="25" x2="50" y2="10" stroke="currentColor" stroke-width="4"/><circle cx="50" cy="8" r="5" fill="#facc15"/></svg>` },
                { id: 'h2', svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="32" fill="currentColor"/><circle cx="38" cy="45" r="6" fill="#facc15"/><circle cx="62" cy="45" r="6" fill="#facc15"/><path d="M 38 62 Q 50 72 62 62" stroke="#fff" stroke-width="4" fill="none"/></svg>` },
                { id: 'h3', svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><polygon points="50,15 80,75 20,75" fill="currentColor"/><circle cx="42" cy="50" r="5" fill="#fff"/><circle cx="58" cy="50" r="5" fill="#fff"/><rect x="40" y="62" width="20" height="4" fill="#fff"/></svg>` }
            ],
            bodies: [
                { id: 'b1', svg: `<svg viewBox="0 0 120 120" class="w-full h-full"><rect x="25" y="20" width="70" height="80" rx="16" fill="currentColor"/><rect x="40" y="35" width="40" height="30" rx="6" fill="#1e293b"/><circle cx="50" cy="80" r="6" fill="#ef4444"/><circle cx="70" cy="80" r="6" fill="#22c55e"/></svg>` },
                { id: 'b2', svg: `<svg viewBox="0 0 120 120" class="w-full h-full"><path d="M 35 20 L 85 20 L 75 95 L 45 95 Z" fill="currentColor"/><circle cx="60" cy="50" r="16" fill="#38bdf8"/><polygon points="60,40 68,58 52,58" fill="#fff"/></svg>` }
            ],
            accessories: [
                { id: 'a1', svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 20 30 Q 50 10 80 30 L 70 80 Q 50 90 30 80 Z" fill="currentColor"/></svg>` },
                { id: 'a2', svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="30" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="70" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="6"/><line x1="44" y1="50" x2="56" y2="50" stroke="currentColor" stroke-width="6"/></svg>` }
            ]
        };

        const colors = ['#38bdf8', '#a855f7', '#f43f5e', '#10b981', '#facc15', '#fb923c', '#64748b'];
        let currentCategory = 'heads';
        let selectedElement = null;

        // Sayfa Yüklendiğinde
        window.onload = () => {
            renderParts();
            renderColorPicker();
        };

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-yellow-400', 'text-gray-900');
                btn.classList.add('hover:bg-white/10');
            });
            document.getElementById(`btn-${cat}`).classList.add('bg-yellow-400', 'text-gray-900');
            renderParts();
        }

        function renderParts() {
            const grid = document.getElementById('parts-grid');
            grid.innerHTML = '';
            partsData[currentCategory].forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white/10 hover:bg-white/20 p-2 rounded-2xl cursor-pointer transition transform hover:scale-105 flex items-center justify-center h-20 text-sky-400';
                card.innerHTML = item.svg;
                card.onclick = () => addToCanvas(item.svg);
                grid.appendChild(card);
            });
        }

        function renderColorPicker() {
            const picker = document.getElementById('color-picker');
            colors.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'w-7 h-7 rounded-full border-2 border-white/50 transition hover:scale-110';
                btn.style.backgroundColor = color;
                btn.onclick = () => changeColor(color);
                picker.appendChild(btn);
            });
        }

        function addToCanvas(svgContent) {
            document.getElementById('placeholder-text').style.display = 'none';
            const canvas = document.getElementById('canvas');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'robot-part absolute w-28 h-28 text-sky-400 flex items-center justify-center';
            wrapper.style.left = `${Math.random() * 40 + 30}%`;
            wrapper.style.top = `${Math.random() * 40 + 30}%`;
            wrapper.innerHTML = svgContent;

            // Sürükle Bırak Olayları
            makeDraggable(wrapper);
            
            wrapper.onclick = (e) => {
                e.stopPropagation();
                if(selectedElement) selectedElement.classList.remove('ring-2', 'ring-yellow-400');
                selectedElement = wrapper;
                selectedElement.classList.add('ring-2', 'ring-yellow-400');
                playBeep();
            };

            canvas.appendChild(wrapper);
            playBeep();
        }

        function changeColor(color) {
            if (selectedElement) {
                selectedElement.style.color = color;
                playBeep();
            }
        }

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }

            function dragTouchStart(e) {
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementTouchDrag(e) {
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX;
                pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }
        }

        function clearCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.querySelectorAll('.robot-part').forEach(el => el.remove());
            document.getElementById('placeholder-text').style.display = 'block';
            selectedElement = null;
            playBeep();
        }

        function activateRobot() {
            const canvas = document.getElementById('canvas');
            canvas.classList.add('dancing');
            
            // Konfeti Efekti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            playBeep(600);
            setTimeout(() => playBeep(800), 150);

            setTimeout(() => {
                canvas.classList.remove('dancing');
            }, 2000);
        }

        // Web Audio API ile Ses Efekti
        function playBeep(freq = 440) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }
    </script>
</body>
</html>
